# electron-builder configuration for the NSIS installer.
#
# CI runs `npm run build:release` first, which produces a complete, unpacked
# portable application at `release/oi-local-judge-<version>-win-x64/`
# (OiJudge.exe + resources/app/ + node_modules/ + native runners). electron-builder
# is invoked with `--prepackaged` pointing at that directory and archives it
# as-is, so it must not pack the project sources again. `asar: false` keeps the
# prepackaged tree byte-for-byte: the app code already lives in
# resources/app/, and wrapping the whole portable tree in an asar would break
# the Electron runtime and the native runners.
appId: com.oij.localjudge
productName: OiJudge

directories:
  output: release/installer

asar: false

# Releases are uploaded manually (or by a workflow) from release/installer.
# An explicit empty provider list stops electron-builder from trying to infer a
# GitHub repository when computing update metadata, which previously failed
# with `TypeError: Cannot read properties of null (reading 'channel')` even
# with `--publish never`.
publish: []

win:
  target:
    - target: nsis
      arch:
        - x64
  # Application/executable icon. electron-builder also embeds this icon in
  # OiJudge.exe when it packs the app itself; `npm run build:installer` stamps
  # the same .ico into the prepackaged exe before archiving (see
  # build/installer/stamp-exe-icon.mjs), because --prepackaged skips that step.
  icon: build/icon.ico
  artifactName: "OiJudge-Setup-${version}.exe"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OiJudge
  # Optional judge-account isolation wizard page (unchecked by default).
  include: build/installer/worker-isolation.nsh
  # Branding shown by the installer, the uninstaller and the header/banner.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
