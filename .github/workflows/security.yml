name: Security scan

# Runs on every push and pull request. It needs full history because leaked
# credentials in earlier commits still matter even after the working tree was
# cleaned.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret and personal-data scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Scan tracked files and history
        run: node tools/security/scan-secrets.mjs --history
